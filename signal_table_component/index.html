<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Colors, font and shapes follow ui_theme.py (the shared app style).
       Wide screens: a table. Narrow (<=640px): each row becomes a two-line card,
       so nothing is cut off sideways on a phone. The whole row is clickable. */
    html, body {
      margin: 0; padding: 0; background: transparent; color: #F2F5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    .list { margin-top: .4rem; font-variant-numeric: tabular-nums; }
    .head, .row { display: grid; grid-template-columns: minmax(0, 2.4fr) 1.1fr .9fr .8fr .6fr minmax(0, 1.9fr) 20px; align-items: center; column-gap: 14px; padding: 11px 12px; }
    .head { background: #101722; color: rgba(255,255,255,.50); font-size: .76rem; font-weight: 560; box-shadow: 0 1px 0 rgba(255,255,255,.07); }
    .row { background: #080D14; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; color: rgba(255,255,255,.82); font-size: .86rem; }
    .row:nth-child(odd) { background: #0A111A; }
    .row:hover { background: #0D1A2A; }
    .row.active { background: rgba(47,128,255,.12); box-shadow: inset 3px 0 0 rgba(110,168,255,.82); }
    .row:focus-visible { outline: 1px solid rgba(110,168,255,.82); outline-offset: -1px; }
    .who { min-width: 0; }
    .ticker { color: #F2F5F8; font-weight: 660; }
    .company { margin-left: 8px; color: rgba(255,255,255,.72); }
    .meta { margin-top: 3px; color: rgba(255,255,255,.42); font-size: .74rem; }
    .who .line1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .num { white-space: nowrap; }
    .up { color: #6EA8FF; } .down { color: #FF5A5F; }
    .hot { color: #6EA8FF; font-weight: 620; }
    .badge { display: inline-flex; align-items: center; height: 24px; border-radius: 999px; padding: 0 9px; font-size: .74rem; font-weight: 620; border: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.035); color: rgba(255,255,255,.82); white-space: nowrap; }
    .badge.strong { background: rgba(255,90,95,.08); color: #FF5A5F; border-color: rgba(255,90,95,.30); }
    .puddle { color: rgba(255,255,255,.72); line-height: 1.35; font-size: .82rem; }
    .chev { color: rgba(255,255,255,.34); font-size: 1.1rem; text-align: right; }
    .row.active .chev { color: #8EC1FF; }
    .empty-note { color: rgba(255,255,255,.46); padding: 1.2rem 0; font-size: .9rem; }
    .lab { display: none; color: rgba(255,255,255,.40); font-size: .7rem; margin-right: 4px; }
    @media (max-width: 640px) {
      .head { display: none; }
      .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who sig" "nums nums" "pud pud"; row-gap: 6px; padding: 12px 10px; }
      .who { grid-area: who; } .sig { grid-area: sig; }
      .nums { grid-area: nums; display: flex; gap: 14px; }
      .puddle { grid-area: pud; }
      .chev { display: none; }
      .lab { display: inline; }
    }
    @media (min-width: 641px) { .nums { display: contents; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const Streamlit = {
      ready() { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*"); },
      setFrameHeight(height) { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height }, "*"); },
      setComponentValue(value) { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value, dataType: "json" }, "*"); }
    };
    let currentArgs = {};

    function esc(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function resizeFrame() {
      const height = Math.ceil(document.getElementById("root").getBoundingClientRect().height);
      Streamlit.setFrameHeight(Math.max(1, height));
    }
    function scheduleResize() {
      resizeFrame();
      requestAnimationFrame(() => { resizeFrame(); requestAnimationFrame(resizeFrame); });
    }
    function select(row) {
      document.querySelectorAll(".row.active").forEach((el) => el.classList.remove("active"));
      row.classList.add("active");
      Streamlit.setComponentValue({ ticker: row.dataset.ticker, signal: row.dataset.signal, nonce: Date.now() });
    }
    function tone(text) {
      const n = parseFloat(text);
      return isNaN(n) ? "" : (n > 0 ? "up" : n < 0 ? "down" : "");
    }
    function renderRow(r) {
      const ticker = r.ticker || "";
      const strong = r.signal === "RSI & Puddle";
      const active = ticker.toUpperCase() === String(currentArgs.selected_ticker || "").toUpperCase();
      const rsiHot = parseFloat(r.rsi) <= 30;
      return `
        <div class="row${active ? " active" : ""}" role="button" tabindex="0" data-ticker="${esc(ticker)}" data-signal="${esc(r.signal)}">
          <div class="who">
            <div class="line1"><span class="ticker">${esc(ticker)}</span><span class="company">${esc(r.company)}</span></div>
            <div class="meta">${esc(r.meta)}</div>
          </div>
          <div class="sig"><span class="badge${strong ? " strong" : ""}">${esc(r.signal_label)}</span></div>
          <div class="nums">
            <div class="num"><span class="lab">가격</span>${esc(r.price)}</div>
            <div class="num ${tone(r.change)}"><span class="lab">등락</span>${esc(r.change)}</div>
            <div class="num${rsiHot ? " hot" : ""}"><span class="lab">RSI</span>${esc(r.rsi)}</div>
          </div>
          <div class="puddle">${esc(r.puddle)}</div>
          <div class="chev">›</div>
        </div>`;
    }
    function render(args) {
      currentArgs = args || {};
      const rows = currentArgs.rows || [];
      const root = document.getElementById("root");
      if (!rows.length) {
        root.innerHTML = `<div class="list"><div class="empty-note">선택한 조건에 맞는 신호가 없어요.</div></div>`;
        scheduleResize();
        return;
      }
      root.innerHTML = `
        <div class="list">
          <div class="head"><div>종목</div><div>신호</div><div>가격</div><div>등락</div><div>RSI</div><div>Puddle 단계</div><div></div></div>
          ${rows.map(renderRow).join("")}
        </div>`;
      document.querySelectorAll(".row").forEach((row) => {
        row.addEventListener("click", () => select(row));
        row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(row); } });
      });
      scheduleResize();
    }
    window.addEventListener("message", (event) => {
      if (event.data.type === "streamlit:render") render(event.data.args);
    });
    window.addEventListener("resize", resizeFrame);
    Streamlit.ready();
  </script>
</body>
</html>
