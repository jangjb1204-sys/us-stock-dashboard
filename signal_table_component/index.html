<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Colors, font and shapes follow ui_theme.py (the shared app style). */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #F2F5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    .signal-table-wrap { margin-top: .4rem; overflow-x:auto; }
    .signal-table { width:100%; border-collapse:collapse; min-width:980px; font-variant-numeric:tabular-nums; }
    .signal-table thead th { padding:11px 12px; text-align:left; color:rgba(255,255,255,.50); font-size:.76rem; font-weight:560; background:#101722; box-shadow:0 1px 0 rgba(255,255,255,.07); }
    .signal-table tbody td { padding:12px; color:rgba(255,255,255,.82); font-size:.86rem; font-weight:450; border-bottom:1px solid rgba(255,255,255,.06); background:#080D14; vertical-align:middle; }
    .signal-table tbody tr:nth-child(even) td { background:#0A111A; }
    .signal-table tbody tr:hover td { background:#0D1A2A; }
    .signal-table .ticker { color:#F2F5F8; font-weight:620; }
    .signal-table .num { color:rgba(255,255,255,.82); white-space:nowrap; }
    .signal-table .muted { color:rgba(255,255,255,.46); }
    .signal-badge { appearance:none; display:inline-flex; align-items:center; height:26px; border-radius:999px; padding:0 10px; font-size:.76rem; font-weight:600; border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.035); color:rgba(255,255,255,.82); white-space:nowrap; font-family:inherit; cursor:pointer; }
    .signal-badge.strong { background:rgba(255,90,95,.08); color:#FF5A5F; border-color:rgba(255,90,95,.30); }
    .signal-badge:hover, .signal-badge:focus-visible, .signal-badge.active { border-color:rgba(110,168,255,.82); outline:none; box-shadow:inset 0 0 0 1px rgba(47,128,255,.14); }
    .type-badge { color:#82B8FF; font-size:.78rem; font-weight:600; }
    .puddle-text { color:rgba(255,255,255,.72); min-width:220px; max-width:330px; line-height:1.34; }
    .empty-note { color:rgba(255,255,255,.46); padding:1.2rem 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const Streamlit = {
      ready() {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
      },
      setFrameHeight(height) {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height }, "*");
      },
      setComponentValue(value) {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value, dataType: "json" }, "*");
      }
    };

    let currentArgs = {};

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function resizeFrame() {
      const root = document.getElementById("root");
      const height = Math.ceil(root.getBoundingClientRect().height);
      Streamlit.setFrameHeight(Math.max(1, height));
    }

    function scheduleResize() {
      resizeFrame();
      window.requestAnimationFrame(() => {
        resizeFrame();
        window.requestAnimationFrame(resizeFrame);
      });
    }

    function selectSignal(button) {
      document.querySelectorAll(".signal-badge.active").forEach((el) => {
        el.classList.remove("active");
        el.setAttribute("aria-pressed", "false");
      });
      button.classList.add("active");
      button.setAttribute("aria-pressed", "true");
      Streamlit.setComponentValue({
        ticker: button.dataset.ticker,
        signal: button.dataset.signal,
        nonce: Date.now()
      });
    }

    function renderRow(row) {
      const signal = row.signal || "";
      const ticker = row.ticker || "";
      const isStrong = signal === "RSI & Puddle";
      const isActive = ticker.toUpperCase() === String(currentArgs.selected_ticker || "").toUpperCase();
      return `
        <tr>
          <td><span class="type-badge">${escapeHtml(row.asset_type)}</span></td>
          <td class="muted">${escapeHtml(row.index)}</td>
          <td class="num">${escapeHtml(row.rank)}</td>
          <td><span class="ticker">${escapeHtml(ticker)}</span></td>
          <td>${escapeHtml(row.company)}</td>
          <td>
            <button
              class="signal-badge${isStrong ? " strong" : ""}${isActive ? " active" : ""}"
              type="button"
              data-ticker="${escapeHtml(ticker)}"
              data-signal="${escapeHtml(signal)}"
              aria-pressed="${isActive ? "true" : "false"}"
            >${escapeHtml(signal)}</button>
          </td>
          <td class="num">${escapeHtml(row.price)}</td>
          <td class="num">${escapeHtml(row.change)}</td>
          <td class="num">${escapeHtml(row.rsi)}</td>
          <td class="puddle-text">${escapeHtml(row.puddle)}</td>
        </tr>
      `;
    }

    function render(args) {
      currentArgs = args || {};
      const rows = currentArgs.rows || [];
      if (!rows.length) {
        document.getElementById("root").innerHTML = `
          <div class="signal-table-wrap"><div class="empty-note">No signals match the selected filters.</div></div>
        `;
        scheduleResize();
        return;
      }

      document.getElementById("root").innerHTML = `
        <div class="signal-table-wrap">
          <table class="signal-table">
            <thead>
              <tr>
                <th>Type</th><th>Index</th><th>Rank</th><th>Ticker</th><th>Company</th>
                <th>Signal</th><th>Price</th><th>Change</th><th>RSI</th><th>Puddle</th>
              </tr>
            </thead>
            <tbody>${rows.map(renderRow).join("")}</tbody>
          </table>
        </div>
      `;

      document.querySelectorAll(".signal-badge").forEach((button) => {
        button.addEventListener("click", () => selectSignal(button));
      });
      scheduleResize();
    }

    window.addEventListener("message", (event) => {
      if (event.data.type !== "streamlit:render") {
        return;
      }
      render(event.data.args);
    });

    window.addEventListener("resize", resizeFrame);
    Streamlit.ready();
  </script>
</body>
</html>
