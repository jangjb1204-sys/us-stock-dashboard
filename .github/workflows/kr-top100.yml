name: KR top-100 scan

# Weekdays 16:40 KST (07:40 UTC), after the KRX close. Results go to the
# kr-scans branch so data commits never touch main (no app redeploys).
on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Scan
        run: python scripts/kr_top100_scan.py out
      - name: Publish to kr-scans branch
        if: always()
        run: |
          git config user.name "kr-scan-bot"
          git config user.email "kr-scan-bot@users.noreply.github.com"
          cp -r out /tmp/out
          if git fetch origin kr-scans 2>/dev/null; then
            git checkout -B kr-scans origin/kr-scans
          else
            git checkout --orphan kr-scans
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/out/* .
          git add kr_top100_*.csv kr_etf30_*.csv kr_top100_debug.json 2>/dev/null || git add kr_top100_debug.json
          git commit -m "KR top-100 scan $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push origin kr-scans
