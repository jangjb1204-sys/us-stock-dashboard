<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Colors, font and shapes follow ui_theme.py (the shared app style). */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #F2F5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    .calendar-shell { width:100%; max-width:100%; overflow:hidden; }
    .calendar-head { display:grid; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; gap:12px; margin:.2rem 0 .9rem; }
    .calendar-title { color:#F2F5F8; font-size:1.02rem; font-weight:650; text-align:center; min-width:0; }
    .calendar-nav, .calendar-day { display:flex; align-items:center; justify-content:center; min-height:36px; border-radius:999px; border:1px solid rgba(255,255,255,.05); background:rgba(255,255,255,.035); color:#F2F5F8; font-size:.78rem; font-weight:620; text-decoration:none; cursor:pointer; box-sizing:border-box; }
    .calendar-nav:hover, .calendar-day:hover { background:rgba(255,255,255,.065); }
    .calendar-nav.disabled { opacity:.34; pointer-events:none; }
    .calendar-grid-static { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; margin-bottom:.45rem; max-width:100%; }
    .calendar-dow { color:rgba(255,255,255,.46); text-align:center; font-size:12px; font-weight:500; letter-spacing:.035em; text-transform:uppercase; padding:.25rem 0; }
    .calendar-empty { min-height:44px; border:1px solid rgba(255,255,255,.035); border-radius:12px; background:rgba(255,255,255,.012); color:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:.8rem; box-sizing:border-box; }
    .calendar-empty.out { opacity:.28; }
    .calendar-day { min-height:44px; border-radius:12px; flex-direction:column; gap:1px; }
    .calendar-day .n { line-height:1.1; }
    .calendar-day .c { font-size:.66rem; font-weight:600; line-height:1; color:#8EC1FF; }
    .calendar-day .c.zero { color:rgba(255,255,255,.30); }
    .calendar-day.selected .c { color:#1F4F99; }
    .calendar-day.selected .c.zero { color:rgba(5,7,11,.45); }
    .calendar-day.selected { background:rgba(242,245,248,.76); color:#05070B; border-color:rgba(242,245,248,.54); }
    @media (max-width:640px){
      .calendar-shell{margin-left:-.1rem;margin-right:-.1rem;}
      .calendar-head{grid-template-columns:38px minmax(0,1fr) 38px; gap:6px; margin:.1rem 0 .55rem;}
      .calendar-title{font-size:.98rem;}
      .calendar-nav{min-height:34px; padding:0; font-size:.95rem;}
      .calendar-grid-static{grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-bottom:.28rem;}
      .calendar-dow{font-size:.58rem; letter-spacing:0; padding:.16rem 0;}
      .calendar-empty,.calendar-day{min-height:40px; border-radius:10px; font-size:.72rem; padding:0;}
      .calendar-day .c{font-size:.6rem;}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const Streamlit = {
      ready() {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
      },
      setFrameHeight(height) {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height }, "*");
      },
      setComponentValue(value) {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value, dataType: "json" }, "*");
      }
    };

    let currentArgs = null;

    function resizeFrame() {
      Streamlit.setFrameHeight(document.documentElement.scrollHeight);
    }

    function choose(date, month) {
      document.querySelectorAll(".calendar-day.selected").forEach((el) => el.classList.remove("selected"));
      const next = document.querySelector(`[data-date="${date}"]`);
      if (next) {
        next.classList.add("selected");
      }
      Streamlit.setComponentValue({ date, month, nonce: Date.now() });
    }

    function render(args) {
      currentArgs = args || currentArgs || {};
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      const header = days.map((day) => `<div class="calendar-dow">${day}</div>`).join("");
      const rows = (currentArgs.weeks || []).map((week) => {
        const cells = week.map((day) => {
          if (day.available) {
            const selected = day.date === currentArgs.selected_date ? " selected" : "";
            const hasCount = day.count !== null && day.count !== undefined;
            const count = hasCount ? `<span class="c${day.count ? "" : " zero"}">${day.count ? day.count + "개" : "0"}</span>` : "";
            const title = hasCount ? ` title="신호 ${day.count}개"` : "";
            return `<button class="calendar-day${selected}" type="button"${title} data-date="${day.date}" data-month="${currentArgs.current_month}"><span class="n">${day.label}</span>${count}</button>`;
          }
          const out = day.in_month ? "" : " out";
          return `<div class="calendar-empty${out}">${day.in_month ? day.label : ""}</div>`;
        }).join("");
        return `<div class="calendar-grid-static">${cells}</div>`;
      }).join("");

      const prevClass = currentArgs.prev_month ? "calendar-nav" : "calendar-nav disabled";
      const nextClass = currentArgs.next_month ? "calendar-nav" : "calendar-nav disabled";
      document.getElementById("root").innerHTML = `
        <div class="calendar-shell">
          <div class="calendar-head">
            <button class="${prevClass}" type="button" data-month="${currentArgs.prev_month || ""}" aria-label="이전 달">‹</button>
            <div class="calendar-title">${currentArgs.title || ""}</div>
            <button class="${nextClass}" type="button" data-month="${currentArgs.next_month || ""}" aria-label="다음 달">›</button>
          </div>
          <div class="calendar-grid-static">${header}</div>
          ${rows}
        </div>
      `;

      document.querySelectorAll(".calendar-day").forEach((button) => {
        button.addEventListener("click", () => choose(button.dataset.date, button.dataset.month));
      });
      document.querySelectorAll(".calendar-nav:not(.disabled)").forEach((button) => {
        button.addEventListener("click", () => choose(currentArgs.selected_date, button.dataset.month));
      });
      resizeFrame();
    }

    window.addEventListener("message", (event) => {
      if (event.data.type !== "streamlit:render") {
        return;
      }
      render(event.data.args);
    });

    window.addEventListener("resize", resizeFrame);
    Streamlit.ready();
  </script>
</body>
</html>
